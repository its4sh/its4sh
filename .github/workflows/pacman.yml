name: pacman contribution graph

on:
  schedule:
    # Daily at 00:17 UTC, off the hour to avoid the scheduler's peak queue.
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    # Keeps the graph current whenever the profile itself changes.
    branches: [main]

# Read-only by default; the publish job opts into contents: write.
permissions:
  contents: read

concurrency:
  group: pacman-contribution-graph
  cancel-in-progress: false

jobs:
  generate:
    name: generate and publish pac-man graph
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write # required to push the generated SVGs to the output branch

    steps:
      - name: Generate Pac-Man SVGs from real contribution data
        uses: abozanona/pacman-contribution-graph@v5.3.2
        with:
          github_user_name: its4sh
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: pacman
          player_style: opportunistic

      - name: Verify generated SVGs
        run: |
          for file in dist/pacman-contribution-graph.svg dist/pacman-contribution-graph-dark.svg; do
            if [ ! -s "$file" ]; then
              echo "::error::Expected output missing or empty: $file"
              exit 1
            fi
          done

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
