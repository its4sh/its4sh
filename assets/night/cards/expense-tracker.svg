  <text x="50" y="42" font-family="'Segoe UI', 'Malgun Gothic', sans-serif" font-size="10.5" letter-spacing="1" fill="#D8D8D8">its4sh / 만드는 중</text>
  <text x="40" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#F2F0EC">Expense Tracker</text>
