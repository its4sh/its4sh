<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="640" height="220" viewBox="0 0 640 220" role="img" aria-labelledby="card-title card-desc">
  <title id="card-title">Expense Tracker</title>
  <desc id="card-desc">A local Python practice project for recording and reviewing expenses. Not published.</desc>
  <defs>
