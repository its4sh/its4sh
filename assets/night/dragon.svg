<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="160" viewBox="0 0 1200 160" role="img" aria-label="Decorative animation: a sakura dragon drifting through a night landscape, chasing falling petals. Decoration only — not a game, not data.">
  <defs>
    <!-- the route the dragon follows -->
    <path id="dpath" d="M-60 118 C150 70 280 142 450 98 C620 56 740 138 920 88 C1050 52 1140 74 1270 34" fill="none"/>
    <!-- independent petal-fall routes -->
    <path id="fall1" d="M170 -12 C186 45 156 100 182 168" fill="none"/>
    <path id="fall2" d="M700 -12 C722 42 686 104 716 168" fill="none"/>
    <path id="fall3" d="M470 -12 C486 50 452 102 482 168" fill="none"/>
    <path id="fall4" d="M1046 -12 C1062 40 1030 96 1058 168" fill="none"/>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#D8D8D8" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#D8D8D8" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#D8D8D8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fog">
      <stop offset="0%" stop-color="#D8D8D8" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#D8D8D8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pearl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F0EC"/>
      <stop offset="1" stop-color="#AFAFAF"/>
    </linearGradient>

    <!-- drifting sakura petal -->
    <g id="dp">
      <path d="M0 0 C-1.6 -0.8 -2.2 -2.6 -1.9 -4.2 C-1.7 -5.2 -0.9 -5.9 -0.4 -5.6 C-0.1 -5.5 0.1 -5.5 0.4 -5.6 C0.9 -5.9 1.7 -5.2 1.9 -4.2 C2.2 -2.6 1.6 -0.8 0 0 Z"
            fill="#F2F0EC" stroke="#AFAFAF" stroke-width="0.4"/>
    </g>
    <g id="spark">
      <path d="M0 -4 Q0.7 -0.7 4 0 Q0.7 0.7 0 4 Q-0.7 0.7 -4 0 Q-0.7 -0.7 0 -4 Z" fill="#FFFFFF"/>
    </g>

    <!-- dragon head, facing +x -->
    <g id="dhead">
      <path d="M-2 -6 C4 -9 10 -8 14 -4 C18 -1 18 3 14 5 C10 8 4 8 0 6 Z"
            fill="url(#pearl)" stroke="#282828" stroke-width="0.8"/>
      <path d="M6 -7 C8 -11 12 -13 16 -13" stroke="#F2F0EC" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      <path d="M10 -5 C13 -8 17 -9 21 -8" stroke="#F2F0EC" stroke-width="1.1" fill="none" stroke-linecap="round"/>
      <circle cx="7" cy="-2.5" r="1.3" fill="#080808"/>
      <circle cx="7.6" cy="-3" r="0.4" fill="#FFFFFF"/>
      <path d="M5 5.5 C9 6.5 12.5 5.5 15 2.5" stroke="#282828" stroke-width="0.7" fill="none" stroke-linecap="round"/>
      <circle cx="16.2" cy="0" r="0.4" fill="#080808"/>
      <path d="M16 2 C22 2 26 5 28 9" stroke="#AFAFAF" stroke-width="0.8" fill="none" stroke-linecap="round"/>
      <path d="M15 5 C20 6 23 10 24 14" stroke="#AFAFAF" stroke-width="0.7" fill="none" stroke-linecap="round"/>
    </g>
    <g id="fin">
      <path d="M0 4 L-3 9 M0 4 L0 10 M0 4 L3 9" stroke="#AFAFAF" stroke-width="0.9" fill="none" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="1200" height="160" fill="#000000"/>
  <rect x="8.5" y="8.5" width="1183" height="143" rx="12" fill="#080808" stroke="#AFAFAF" stroke-opacity="0.55"/>

  <!-- moon -->
  <circle cx="1012" cy="42" r="46" fill="url(#glow)"/>
  <circle cx="1012" cy="42" r="13" fill="#D8D8D8"/>
  <circle cx="1007" cy="38" r="9.5" fill="#F2F0EC" opacity="0.35"/>
  <circle cx="1016" cy="46" r="2.2" fill="#AFAFAF" opacity="0.35"/>
  <circle cx="1006" cy="47" r="1.6" fill="#AFAFAF" opacity="0.3"/>

  <!-- stars -->
  <g fill="#FFFFFF">
    <circle cx="120" cy="34" r="1" opacity="0.7"/>
    <circle cx="300" cy="58" r="0.9" opacity="0.55"/>
    <circle cx="520" cy="30" r="1.1" opacity="0.75"/>
    <circle cx="640" cy="66" r="0.8" opacity="0.5"/>
    <circle cx="780" cy="36" r="1" opacity="0.65"/>
    <circle cx="880" cy="58" r="0.9" opacity="0.55"/>
    <circle cx="1120" cy="90" r="0.9" opacity="0.6"/>
    <circle cx="220" cy="92" r="0.8" opacity="0.5"/>
  </g>
  <use xlink:href="#spark" href="#spark" transform="translate(420 52) scale(0.7)">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.8s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#spark" href="#spark" transform="translate(960 24) scale(0.55)">
    <animate attributeName="opacity" values="0.15;0.8;0.15" dur="4.6s" begin="-1.6s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#spark" href="#spark" transform="translate(80 118) scale(0.45)">
    <animate attributeName="opacity" values="0.15;0.7;0.15" dur="5.2s" begin="-3s" repeatCount="indefinite"/>
  </use>

  <!-- mountains + mist -->
  <ellipse cx="1000" cy="128" rx="190" ry="28" fill="url(#fog)"/>
  <ellipse cx="420" cy="146" rx="240" ry="24" fill="url(#fog)" opacity="0.6"/>
  <path d="M10 152 L96 114 L182 138 L272 102 L362 148 L442 120 L522 144 L606 128 L686 146 L766 112 L846 140 L926 106 L1006 136 L1086 110 L1160 138 L1190 124 L1190 152 L10 152 Z" fill="#151515"/>
  <path d="M10 152 L98 128 L190 146 L290 118 L390 150 L490 126 L590 148 L690 124 L790 150 L890 122 L990 148 L1090 124 L1188 148 L1190 152 Z" fill="#080808" stroke="#282828" stroke-width="1"/>
  <line x1="10" y1="144" x2="1190" y2="144" stroke="#AFAFAF" stroke-opacity="0.08" stroke-width="5"/>
  <line x1="40" y1="150" x2="1160" y2="150" stroke="#AFAFAF" stroke-opacity="0.06" stroke-width="3"/>

  <!-- soft glow along the dragon's route -->
  <use xlink:href="#dpath" href="#dpath" stroke="#151515" stroke-width="30" stroke-opacity="0.55" stroke-linecap="round"/>
  <use xlink:href="#dpath" href="#dpath" stroke="#282828" stroke-width="9" stroke-opacity="0.4" stroke-linecap="round"/>

  <!-- petals ahead of the dragon — the chase -->
  <g opacity="0.95">
    <use xlink:href="#dp" href="#dp"/>
    <animateMotion dur="14s" begin="-13.4s" repeatCount="indefinite" rotate="auto"><mpath xlink:href="#dpath"/></animateMotion>
  </g>
  <g opacity="0.85">
    <use xlink:href="#dp" href="#dp" transform="scale(0.85)"/>
    <animateMotion dur="14s" begin="-12.7s" repeatCount="indefinite" rotate="auto"><mpath xlink:href="#dpath"/></animateMotion>
  </g>

  <!-- dragon head -->
  <g>
    <use xlink:href="#dhead" href="#dhead"/>
    <animateMotion dur="14s" begin="0s" repeatCount="indefinite" rotate="auto"><mpath xlink:href="#dpath"/></animateMotion>
  </g>

  <!-- fins riding the body -->
  <g opacity="0.9">
    <use xlink:href="#fin" href="#fin"/>
    <animateMotion dur="14s" begin="-13.48s" repeatCount="indefinite" rotate="auto"><mpath xlink:href="#dpath"/></animateMotion>
  </g>
  <g opacity="0.9">
    <use xlink:href="#fin" href="#fin"/>
    <animateMotion dur="14s" begin="-12.96s" repeatCount="indefinite" rotate="auto"><mpath xlink:href="#dpath"/></animateMotion>
  </g>

  <!-- tapering body -->
  <circle r="7.5" fill="url(#pearl)"><animateMotion dur="14s" begin="-13.87s" repeatCount="indefinite"><mpath xlink:href="#dpath"/></animateMotion></circle>
  <circle r="6.9" fill="url(#pearl)"><animateMotion dur="14s" begin="-13.74s" repeatCount="indefinite"><mpath xlink:href="#dpath"/></animateMotion></circle>
  <circle r="6.4" fill="url(#pearl)"><animateMotion dur="14s" begin="-13.61s" repeatCount="indefinite"><mpath xlink:href="#dpath"/></animateMotion></circle>
  <circle r="5.9" fill="url(#pearl)"><animateMotion dur="14s" begin="-13.48s" repeatCount="indefinite"><mpath xlink:href="#dpath"/></animateMotion></circle>
  <circle r="5.4" fill="#AFAFAF"><animateMotion dur="14s" begin="-13.35s" repeatCount="indefinite"><mpath xlink:href="#dpath"/></animateMotion></circle>
  <circle r="5" fill="#AFAFAF"><animateMotion dur="14s" begin="-13.22s" repeatCount="indefinite"><mpath xlink:href="#dpath"/></animateMotion></circle>
  <circle r="4.6" fill="#AFAFAF"><animateMotion dur="14s" begin="-13.09s" repeatCount="indefinite"><mpath xlink:href="#dpath"/></animateMotion></circle>
  <circle r="4.2" fill="#AFAFAF"><animateMotion dur="14s" begin="-12.96s" repeatCount="indefinite"><mpath xlink:href="#dpath"/></animateMotion></circle>
  <circle r="3.8" fill="#AFAFAF"><animateMotion dur="14s" begin="-12.83s" repeatCount="indefinite"><mpath xlink:href="#dpath"/></animateMotion></circle>
  <circle r="3.4" fill="#282828" stroke="#AFAFAF" stroke-opacity="0.35" stroke-width="0.5"><animateMotion dur="14s" begin="-12.7s" repeatCount="indefinite"><mpath xlink:href="#dpath"/></animateMotion></circle>
  <circle r="3" fill="#282828" stroke="#AFAFAF" stroke-opacity="0.3" stroke-width="0.5"><animateMotion dur="14s" begin="-12.57s" repeatCount="indefinite"><mpath xlink:href="#dpath"/></animateMotion></circle>
  <circle r="2.6" fill="#282828" stroke="#AFAFAF" stroke-opacity="0.3" stroke-width="0.5"><animateMotion dur="14s" begin="-12.44s" repeatCount="indefinite"><mpath xlink:href="#dpath"/></animateMotion></circle>
  <circle r="2.2" fill="#282828" stroke="#AFAFAF" stroke-opacity="0.25" stroke-width="0.5"><animateMotion dur="14s" begin="-12.31s" repeatCount="indefinite"><mpath xlink:href="#dpath"/></animateMotion></circle>
  <circle r="1.8" fill="#282828" stroke="#AFAFAF" stroke-opacity="0.25" stroke-width="0.4"><animateMotion dur="14s" begin="-12.18s" repeatCount="indefinite"><mpath xlink:href="#dpath"/></animateMotion></circle>

  <!-- independent falling petals -->
  <g opacity="0.9"><use xlink:href="#dp" href="#dp"/><animateMotion dur="12s" begin="-4s" repeatCount="indefinite" rotate="auto"><mpath xlink:href="#fall1"/></animateMotion></g>
  <g opacity="0.75"><use xlink:href="#dp" href="#dp" transform="scale(0.8)"/><animateMotion dur="15s" begin="-9s" repeatCount="indefinite" rotate="auto"><mpath xlink:href="#fall2"/></animateMotion></g>
  <g opacity="0.8"><use xlink:href="#dp" href="#dp" transform="scale(0.7)"/><animateMotion dur="13s" begin="-2s" repeatCount="indefinite" rotate="auto"><mpath xlink:href="#fall3"/></animateMotion></g>
  <g opacity="0.7"><use xlink:href="#dp" href="#dp" transform="scale(0.9)"/><animateMotion dur="16s" begin="-11s" repeatCount="indefinite" rotate="auto"><mpath xlink:href="#fall4"/></animateMotion></g>

  <text x="1174" y="112" text-anchor="middle" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#AFAFAF" opacity="0.75">달</text>
  <text x="1174" y="130" text-anchor="middle" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="11" fill="#AFAFAF" opacity="0.75">빛</text>
</svg>
