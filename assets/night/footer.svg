  <ellipse cx="600" cy="132" rx="260" ry="28" fill="url(#fog)" opacity="0.55"/>
  <path d="M8 152 L92 112 L172 136 L262 100 L352 148 L432 118 L512 144 L596 128 L676 146 L756 112 L836 140 L916 106 L996 136 L1076 110 L1160 138 L1192 122 L1192 152 L8 152 Z" fill="#151515"/>
