<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="160" viewBox="0 0 1200 160" role="img" aria-labelledby="footer-title">
  <title id="footer-title">its4sh — build at night, learn by day</title>
  <defs>
    <g id="blossom">
