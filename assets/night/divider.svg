<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="36" viewBox="0 0 1200 36" role="img" aria-label="Decorative divider">
  <defs>
    <!-- realistic sakura petal: notched tip, shaded base, ink veins -->
    <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D8D8D8"/>
    </linearGradient>
    <g id="petal">
      <path d="M0 0 C-3 -1.2 -4.1 -4.6 -3.7 -7.5 C-3.4 -9.5 -2.3 -11.1 -1.1 -11.5 C-0.5 -11.7 -0.1 -11.4 -0.15 -10.6 C-0.05 -10 0.05 -10 0.15 -10.6 C0.1 -11.4 0.5 -11.7 1.1 -11.5 C2.3 -11.1 3.4 -9.5 3.7 -7.5 C4.1 -4.6 3 -1.2 0 0 Z"
            fill="url(#pg)" stroke="#AFAFAF" stroke-width="0.55" stroke-opacity="0.9"/>
      <g stroke="#AFAFAF" stroke-width="0.35" stroke-opacity="0.5" fill="none">
        <path d="M0 -1.2 L0 -9"/>
        <path d="M0 -3.6 C-1.1 -4.6 -1.8 -6.2 -2 -7.9"/>
        <path d="M0 -3.6 C1.1 -4.6 1.8 -6.2 2 -7.9"/>
      </g>
    </g>
    <g id="blossom">
