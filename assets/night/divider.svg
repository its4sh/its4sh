  <rect width="1200" height="36" fill="#000000"/>
  <rect x="6.5" y="6.5" width="1187" height="23" rx="8" fill="#080808" stroke="#AFAFAF" stroke-opacity="0.4"/>

  <path d="M8 29.5 L120 22 L240 26 L360 20 L480 26 L600 22 L720 27 L840 21 L960 26 L1080 22 L1192 27 L1192 29.5 Z" fill="#151515"/>
  <line x1="40" y1="27.5" x2="1160" y2="27.5" stroke="#AFAFAF" stroke-opacity="0.08" stroke-width="1.5"/>

  <line x1="70" y1="18" x2="540" y2="18" stroke="#AFAFAF" stroke-opacity="0.3"/>
  <line x1="660" y1="18" x2="1090" y2="18" stroke="#AFAFAF" stroke-opacity="0.3"/>
  <path d="M552 18 l4.5 -4.5 4.5 4.5 -4.5 4.5 z" fill="none" stroke="#AFAFAF" stroke-opacity="0.45" stroke-width="0.7"/>
  <path d="M648 18 l4.5 -4.5 4.5 4.5 -4.5 4.5 z" fill="none" stroke="#AFAFAF" stroke-opacity="0.45" stroke-width="0.7"/>

  <path d="M1193 8 C1180 12 1168 11 1156 16 C1144 21 1134 22 1124 26" stroke="#282828" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <use xlink:href="#cluster" href="#cluster" transform="translate(600 19) rotate(-8)"/>
  <use xlink:href="#blossom" href="#blossom" transform="translate(1156 15) rotate(-18) scale(0.58)"/>
  <use xlink:href="#blossom" href="#blossom" transform="translate(1124 25) rotate(24) scale(0.44)"/>
  <use xlink:href="#bud" href="#bud" transform="translate(1104 27) rotate(30) scale(0.6)"/>
  <use xlink:href="#petal" href="#petal" transform="translate(520 27) rotate(140) scale(0.42)"/>
  <use xlink:href="#petal" href="#petal" transform="translate(690 8) rotate(-140) scale(0.36)"/>
  <use xlink:href="#spark" href="#spark" transform="translate(150 12) scale(0.4)"/>
  <use xlink:href="#spark" href="#spark" transform="translate(1050 10) scale(0.32)"/>
  <circle cx="240" cy="10" r="0.8" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="430" cy="25" r="0.7" fill="#FFFFFF" opacity="0.55"/>
  <circle cx="920" cy="12" r="0.8" fill="#FFFFFF" opacity="0.65"/>
