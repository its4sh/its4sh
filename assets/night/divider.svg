      <use xlink:href="#petal" href="#petal" transform="rotate(72)"/>
      <use xlink:href="#petal" href="#petal" transform="rotate(144)"/>
      <use xlink:href="#petal" href="#petal" transform="rotate(216)"/>
      <use xlink:href="#petal" href="#petal" transform="rotate(288)"/>
      <g stroke="#AFAFAF" stroke-width="0.4" stroke-opacity="0.85">
        <line x1="0" y1="-0.8" x2="0" y2="-6"/>
        <line x1="0" y1="-0.8" x2="-2.8" y2="-5.2"/>
        <line x1="0" y1="-0.8" x2="2.8" y2="-5.2"/>
        <line x1="0" y1="-0.8" x2="-5" y2="-2.6"/>
        <line x1="0" y1="-0.8" x2="5" y2="-2.6"/>
      </g>
      <g fill="#D8D8D8">
        <circle cx="0" cy="-6.2" r="0.5"/>
        <circle cx="-2.9" cy="-5.4" r="0.5"/>
        <circle cx="2.9" cy="-5.4" r="0.5"/>
        <circle cx="-5.2" cy="-2.7" r="0.5"/>
        <circle cx="5.2" cy="-2.7" r="0.5"/>
        <circle cx="0" cy="-0.8" r="0.8" fill="#AFAFAF"/>
      </g>
    </g>
    <g id="bud">
