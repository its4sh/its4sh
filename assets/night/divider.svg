      <use xlink:href="#blossom" href="#blossom" transform="translate(12 -4) rotate(-40) scale(0.52)"/>
      <use xlink:href="#blossom" href="#blossom" transform="translate(-11 -3) rotate(38) scale(0.5)"/>
      <use xlink:href="#blossom" href="#blossom" transform="translate(4 -10) rotate(75) scale(0.38)"/>
      <use xlink:href="#bud" href="#bud" transform="translate(-16 1) rotate(-32) scale(0.7)"/>
    </g>
    <g id="spark">
