<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="36" viewBox="0 0 1200 36" role="img" aria-label="Decorative divider">
  <defs>
    <g id="blossom">
      <g fill="#FFFFFF" stroke="#AFAFAF" stroke-opacity="0.55" stroke-width="0.7">
        <ellipse cx="0" cy="-9" rx="4.8" ry="8.6"/>
        <ellipse cx="0" cy="-9" rx="4.8" ry="8.6" transform="rotate(72)"/>
        <ellipse cx="0" cy="-9" rx="4.8" ry="8.6" transform="rotate(144)"/>
        <ellipse cx="0" cy="-9" rx="4.8" ry="8.6" transform="rotate(216)"/>
        <ellipse cx="0" cy="-9" rx="4.8" ry="8.6" transform="rotate(288)"/>
      </g>
      <g fill="#F2F0EC" opacity="0.55">
        <ellipse cx="0" cy="-5.4" rx="2.2" ry="3.8"/>
        <ellipse cx="0" cy="-5.4" rx="2.2" ry="3.8" transform="rotate(144)"/>
        <ellipse cx="0" cy="-5.4" rx="2.2" ry="3.8" transform="rotate(288)"/>
      </g>
      <g stroke="#AFAFAF" stroke-width="0.55" stroke-opacity="0.8">
        <line x1="0" y1="0" x2="0" y2="-4.4"/>
        <line x1="0" y1="0" x2="4.2" y2="-1.3"/>
        <line x1="0" y1="0" x2="2.6" y2="3.4"/>
        <line x1="0" y1="0" x2="-2.6" y2="3.4"/>
        <line x1="0" y1="0" x2="-4.2" y2="-1.3"/>
      </g>
      <g fill="#AFAFAF">
        <circle cx="0" cy="-4.8" r="0.75"/>
        <circle cx="4.5" cy="-1.4" r="0.75"/>
        <circle cx="2.8" cy="3.7" r="0.75"/>
        <circle cx="-2.8" cy="3.7" r="0.75"/>
        <circle cx="-4.5" cy="-1.4" r="0.75"/>
      </g>
    </g>
    <g id="sparkle">
      <path d="M0 -5 Q0.8 -0.8 5 0 Q0.8 0.8 0 5 Q-0.8 0.8 -5 0 Q-0.8 -0.8 0 -5 Z" fill="#FFFFFF"/>
    </g>
    <ellipse id="petal" rx="3" ry="5" fill="#FFFFFF" opacity="0.9"/>
  </defs>

  <rect width="1200" height="36" fill="#000000"/>
  <rect x="6.5" y="6.5" width="1187" height="23" rx="8" fill="#080808" stroke="#AFAFAF" stroke-opacity="0.4"/>

  <!-- distant ridge, like the banner's mountain band -->
  <path d="M8 29.5 L120 22 L240 26 L360 20 L480 26 L600 22 L720 27 L840 21 L960 26 L1080 22 L1192 27 L1192 29.5 Z" fill="#151515"/>
  <line x1="40" y1="27.5" x2="1160" y2="27.5" stroke="#AFAFAF" stroke-opacity="0.08" stroke-width="1.5"/>

  <line x1="70" y1="18" x2="540" y2="18" stroke="#AFAFAF" stroke-opacity="0.3"/>
  <line x1="660" y1="18" x2="1100" y2="18" stroke="#AFAFAF" stroke-opacity="0.3"/>
  <path d="M552 18 l4.5 -4.5 4.5 4.5 -4.5 4.5 z" fill="#AFAFAF" fill-opacity="0.4"/>
  <path d="M648 18 l4.5 -4.5 4.5 4.5 -4.5 4.5 z" fill="#AFAFAF" fill-opacity="0.4"/>

  <!-- branch fragment entering from the right, like the banner -->
  <path d="M1193 9 C1176 13 1160 12 1144 18" stroke="#282828" stroke-width="2" fill="none" stroke-linecap="round"/>
  <use xlink:href="#blossom" href="#blossom" transform="translate(1144 18) rotate(-20) scale(0.62)"/>
  <use xlink:href="#petal" href="#petal" transform="translate(1096 26) rotate(30) scale(0.65)"/>
  <use xlink:href="#blossom" href="#blossom" transform="translate(600 18) rotate(-12) scale(0.62)"/>
  <use xlink:href="#sparkle" href="#sparkle" transform="translate(150 12) scale(0.35)"/>
  <use xlink:href="#sparkle" href="#sparkle" transform="translate(1050 11) scale(0.3)"/>
  <circle cx="240" cy="10" r="0.8" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="430" cy="24" r="0.7" fill="#FFFFFF" opacity="0.55"/>
</svg>
